[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "gateway"

[services.build]
buildCommand = "cd backend && uv sync --frozen"

[services.deploy]
startCommand = "cd backend && uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port $PORT"

[services.variables]
# Copy these from your .env file or set them in Railway dashboard:
# DEEPSEEK_API_KEY = "sk-..."
# TELEGRAM_BOT_TOKEN = "..."
# TAVILY_API_KEY = "tvly-..."  (optional)
